<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="amber-red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="cyan-indigo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-red" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" />
      <circle cx="20" cy="20" r="1" fill="#94a3b8" fill-opacity="0.1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Glow Effects -->
  <circle cx="950" cy="250" r="280" fill="#ef4444" fill-opacity="0.08" filter="url(#glow-red)" />
  <circle cx="750" cy="380" r="220" fill="#f59e0b" fill-opacity="0.07" filter="url(#glow-amber)" />

  <!-- Decorative Tech Circuit / Line Overlay -->
  <path d="M 50 120 L 400 120 L 480 200 M 100 520 L 350 520 L 420 450" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="4 6" opacity="0.6" />
  <circle cx="480" cy="200" r="4" fill="#f59e0b" />
  <circle cx="420" cy="450" r="4" fill="#ef4444" />

  <!-- Left Side: Title & Subtitle Graphic Text Placeholder / Branding -->
  <g transform="translate(80, 150)">
    <rect x="0" y="0" width="140" height="32" rx="16" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5" />
    <text x="70" y="21" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">GESTÃO FINANCEIRA</text>

    <!-- Main Graphic Title Representation -->
    <text x="0" y="90" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Oficina com Movimento
    </text>
    <text x="0" y="145" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      mas Sem Lucro
    </text>

    <text x="0" y="200" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      O que os números da sua operação estão escondendo?
    </text>

    <!-- Stat Highlights -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="160" height="70" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
      <text x="16" y="28" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">CONVERSÃO REAL</text>
      <text x="16" y="54" fill="#ef4444" font-family="sans-serif" font-size="22" font-weight="800">55% <tspan font-size="12" fill="#94a3b8" font-weight="400">(alerta)</tspan></text>

      <rect x="180" y="0" width="180" height="70" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
      <text x="196" y="28" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">RAMPA PARADA</text>
      <text x="196" y="54" fill="#f59e0b" font-family="sans-serif" font-size="22" font-weight="800">-R$ 720<tspan font-size="12" fill="#94a3b8" font-weight="400">/dia</tspan></text>
    </g>
  </g>

  <!-- Right Side: Dashboard UI Mockup with Discrepancy Graphic -->
  <g transform="translate(680, 110)">
    <!-- Card Glass Panel -->
    <rect x="0" y="0" width="440" height="410" rx="20" fill="#0f172a" fill-opacity="0.85" stroke="url(#card-border)" stroke-width="2" />
    
    <!-- Top Header -->
    <path d="M 0 20 C 0 9 9 0 20 0 L 420 0 C 431 0 440 9 440 20 L 440 60 L 0 60 Z" fill="#1e293b" fill-opacity="0.5" />
    <circle cx="28" cy="30" r="6" fill="#ef4444" />
    <circle cx="48" cy="30" r="6" fill="#f59e0b" />
    <circle cx="68" cy="30" r="6" fill="#10b981" />
    <text x="100" y="35" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600">Diagnóstico de Lucratividade</text>

    <!-- Graph / Metrics Visualization -->
    <!-- Car Motion Trend vs Profit Gap -->
    <g transform="translate(30, 90)">
      <text x="0" y="15" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="600">FLUXO DE VEÍCULOS VS RECEITA REAL</text>
      
      <!-- Graph Lines -->
      <path d="M 0 140 Q 90 60 180 40 T 380 20" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="6 4" />
      <text x="310" y="15" fill="#3b82f6" font-family="sans-serif" font-size="11" font-weight="700">Carros no Pátio ↑</text>

      <!-- Profit Line (Falling behind) -->
      <path d="M 0 140 Q 90 120 180 135 T 380 150" fill="none" stroke="#ef4444" stroke-width="4" filter="url(#glow-red)" />
      <text x="310" y="165" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="700">Lucro Real ↓</text>

      <!-- Gap / Leak Indicator -->
      <path d="M 220 55 L 220 130" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3" />
      <circle cx="220" cy="92" r="14" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="2" />
      <text x="220" y="97" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">!</text>
      
      <!-- Callout Box -->
      <rect x="235" y="70" width="135" height="42" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <text x="245" y="87" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="700">Gargalo de OS</text>
      <text x="245" y="102" fill="#94a3b8" font-family="sans-serif" font-size="10">45% Não Convertido</text>
    </g>

    <!-- Bottom Stat Rows inside Card -->
    <g transform="translate(30, 275)">
      <rect x="0" y="0" width="380" height="48" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="24" r="8" fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-width="2" />
      <text x="44" y="28" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">Orçamentos sem Follow-up</text>
      <text x="360" y="28" fill="#ef4444" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="end">- R$ 4.800/sem</text>

      <rect x="0" y="58" width="380" height="48" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="24" r="8" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="2" />
      <text x="44" y="28" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">Meta de Conversão Ideal</text>
      <text x="360" y="28" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="end">&gt; 70%</text>
    </g>
  </g>
</svg>
